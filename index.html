<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Recepción de Evidencias</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background-color: #ffffff;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background-color: #ffffff;
            background-image: url("Fondo_Centrado_1080x1920.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .card {
            width: 315px;
            max-width: 90vw;

            background: rgba(255, 255, 255, 0.97);

            border-top: 6px solid #D8242A;
            border-bottom: 6px solid #7A2947;
            border-radius: 16px;

            padding: 20px;

            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #333333;

            margin-bottom: 12px;

            font-size: 20px;
            line-height: 1.25;
        }

        .subtitulo {
            text-align: center;

            color: #555555;

            margin-bottom: 20px;

            font-size: 12px;
            line-height: 1.6;
        }

        .area-archivo {
            width: 100%;

            display: flex;
            justify-content: center;

            margin-bottom: 15px;
        }

        input[type="file"] {
            display: block;

            width: 100%;
            max-width: 100%;

            font-size: 12px;
        }

        .btn {
            display: block;

            width: 100%;

            margin: 0 auto;

            padding: 12px;

            background: #7A2947;
            color: #ffffff;

            border: none;
            border-radius: 5px;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.3s ease,
                opacity 0.3s ease;
        }

        .btn:hover {
            background: #D8242A;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        #contador {
            display: block;

            margin-top: 16px;

            color: #666666;

            text-align: center;
            font-size: 11px;
            line-height: 1.4;

            overflow-wrap: anywhere;
        }

        #resultado {
            margin-top: 16px;

            text-align: center;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.5;
        }

        .ok {
            color: #28A745;
        }

        .error {
            color: #D8242A;
        }

        /*
         * Ajustes para celulares y tabletas verticales.
         * Esta sección debe colocarse fuera del bloque body.
         */
        @media screen and (max-width: 768px) {
            body {
                min-height: 100vh;
                min-height: 100dvh;

                padding:
                    max(16px, env(safe-area-inset-top))
                    16px
                    max(16px, env(safe-area-inset-bottom));

                /*
                 * Ajusta el fondo al alto dinámico del navegador.
                 * El valor 110dvh amplía ligeramente la imagen
                 * para evitar franjas blancas.
                 */
                background-size: auto 110dvh;
                background-position: center center;
                background-attachment: scroll;
            }

            .card {
                width: 315px;
                max-width: 92vw;

                padding: 20px;
            }
        }

        /*
         * Ajuste para pantallas móviles muy pequeñas.
         */
        @media screen and (max-width: 380px) {
            .card {
                max-width: 94vw;
                padding: 18px;
            }

            h1 {
                font-size: 19px;
            }

            .subtitulo {
                font-size: 11px;
            }
        }

        /*
         * Ajuste para pantallas horizontales o de poca altura.
         */
        @media screen and (max-height: 650px) {
            body {
                align-items: flex-start;
                padding-top: 24px;
                padding-bottom: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <h1>
            ¡Gracias por asistir a este curso!
        </h1>

        <div class="subtitulo">
            Nos gustaría conocer cómo viviste esta capacitación.
            Comparte las fotos o videos que hayas tomado durante el curso.
        </div>

        <div class="area-archivo">
            <input
                type="file"
                id="files"
                multiple
                accept=".jpg,.jpeg,.png,.mp4,.mov"
            >
        </div>

        <button
            type="button"
            id="btnEnviar"
            class="btn"
            onclick="subirArchivos()"
        >
            Enviar archivos
        </button>

        <span id="contador" aria-live="polite"></span>

        <p id="resultado" aria-live="polite"></p>

    </main>

    <script>
        /*
         * Pega aquí únicamente la URL del desencadenador HTTP.
         * No agregues etiquetas <a>, href ni otros elementos HTML.
         */
        const FLOW_URL = "PEGA_AQUI_LA_NUEVA_URL_DE_POWER_AUTOMATE";

        async function convertirABase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => {
                    const contenidoBase64 = reader.result.split(",")[1];
                    resolve(contenidoBase64);
                };

                reader.onerror = () => {
                    reject(new Error("No fue posible leer el archivo."));
                };

                reader.readAsDataURL(file);
            });
        }

        function mostrarError(mensaje) {
            const resultado = document.getElementById("resultado");

            resultado.className = "error";
            resultado.textContent = mensaje;
        }

        async function subirArchivos() {
            const selector = document.getElementById("files");
            const archivos = selector.files;

            const resultado = document.getElementById("resultado");
            const contador = document.getElementById("contador");
            const boton = document.getElementById("btnEnviar");

            resultado.textContent = "";
            resultado.className = "";
            contador.textContent = "";

            if (archivos.length === 0) {
                mostrarError("Seleccione al menos un archivo.");
                return;
            }

            if (
                !FLOW_URL ||
                FLOW_URL === "PEGA_AQUI_LA_NUEVA_URL_DE_POWER_AUTOMATE"
            ) {
                mostrarError(
                    "La dirección de Power Automate no está configurada."
                );
                return;
            }

            boton.disabled = true;
            boton.textContent = "Enviando archivos...";

            try {
                for (let i = 0; i < archivos.length; i++) {
                    const archivo = archivos[i];

                    contador.textContent =
                        `Subiendo ${i + 1} de ${archivos.length}: ` +
                        archivo.name;

                    const base64 = await convertirABase64(archivo);

                    const response = await fetch(FLOW_URL, {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nombreArchivo: archivo.name,
                            contenidoArchivo: base64
                        })
                    });

                    if (!response.ok) {
                        throw new Error(
                            `No fue posible cargar ${archivo.name}. ` +
                            `Código HTTP: ${response.status}`
                        );
                    }
                }

                contador.textContent = "";

                resultado.className = "ok";
                resultado.textContent =
                    "✓ Archivos cargados correctamente.";

                selector.value = "";
            } catch (error) {
                contador.textContent = "";

                mostrarError(
                    "✖ No fue posible cargar los archivos al repositorio. " +
                    "Intente nuevamente."
                );

                console.error("Error durante la carga:", error);
            } finally {
                boton.disabled = false;
                boton.textContent = "Enviar archivos";
            }
        }
    </script>

</body>

</html>
