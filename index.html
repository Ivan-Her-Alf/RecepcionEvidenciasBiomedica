<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recepción de Evidencias</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-image: url("Fondo_Centrado_1080x1920.png");
	        margin:0;
			background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
        }

        .card{
            width:315px;
	    	max-width:80vW;
            background:white;
            border-top:6px solid #D8242A;
            border-bottom:6px solid #7A2947;
            border-radius:16px;
            padding:20px;
            box-shadow: 0 10px 20px rgba(0,0,0,.10);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:8px;
	    	font-size:20px;
        }

        .subtitulo{
            text-align:center;
            color:#555;
            line-height:1.6;
            margin-bottom:20px;
            font-size:11px;
        }

        .area-archivo{
            text-align:center;
            margin-bottom:15px;
        }

        input[type=file]{
            display:block;
            margin:auto;
        }

        .btn{
            display:block;
            width:280px;
            margin:auto;
            background:#7A2947;
            color:white;
            border:none;
            border-radius:5px;
            padding:12px;
            font-size:11px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#D8242A;
        }

        #contador{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#666;
        }

        #resultado{
            text-align:center;
            margin-top:20px;
            font-weight:bold;
        }

        .ok{
            color:#28a745;
        }

        .error{
            color:#D8242A;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>
        ¡Gracias por asistir a este curso!
    </h1>

    <div class="subtitulo">
        Nos gustaría conocer cómo viviste esta capacitación.
        Comparte las fotos o videos que hayas tomado durante el curso.
    </div>

    <div class="area-archivo">
        <input
            type="file"
            id="files"
            multiple
            accept=".jpg,.jpeg,.png,.mp4,.mov">
    </div>

    <button
        class="btn"
        onclick="subirArchivos()">
        Enviar archivos
    </button>

    <span id="contador"></span>
    <p id="resultado"></p>

</div>

<script>

// RECUERDA REMPLAZAR ESTA CADENA POR TU URL REAL DE MICROSOFT POWER AUTOMATE
const FLOW_URL = "https://default226a5b51d2894b31be72824bcc61e8.91.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/01/workflows/ae587d78901a4e3f9b6c03bdd61a40a2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=gDlNI-JkT-8kGISG3-Qad7764e_CIp77QA_iOq_uDiU";

async function convertirABase64(file){
    return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => {
            resolve(reader.result.split(',')[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function subirArchivos(){
    const archivos = document.getElementById("files").files;
    const resultado = document.getElementById("resultado");
    const contador = document.getElementById("contador");

    if(archivos.length === 0){
        resultado.className = "error";
        resultado.innerHTML = "Seleccione al menos un archivo.";
        return;
    }

    try{
        for(let i=0;i<archivos.length;i++){
            contador.innerHTML = `Subiendo ${i+1} de ${archivos.length}: ${archivos[i].name}`;

            const base64 = await convertirABase64(archivos[i]);

            const response = await fetch(
                FLOW_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        nombreArchivo: archivos[i].name,
                        contenidoArchivo: base64
                    })
                }
            );

            if(!response.ok){
                throw new Error();
            }
        }

        contador.innerHTML = "";
        resultado.className = "ok";
        resultado.innerHTML = "✓ Archivos cargados correctamente.";
    }
    catch{
        contador.innerHTML = "";
        resultado.className = "error";
        resultado.innerHTML = "✖ No fue posible cargar los archivos al repositorio. Intente nuevamente.";
    }
}

</script>

</body>
</html>
